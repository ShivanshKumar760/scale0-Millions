apiVersion: v1
kind: Namespace
metadata:
  name: coderunner                  # the API lives here
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: sandbox                     # untrusted user code runs here
  labels:
    pod-security.kubernetes.io/enforce: restricted   # API server REJECTS Pods that are privileged, root, etc.
    pod-security.kubernetes.io/enforce-version: latest