apiVersion: v1
kind: ServiceAccount
metadata:
  name: code-runner-api
  namespace: coderunner
---
# Least privilege: the API may manage Jobs and read Pods/logs ONLY inside `sandbox`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-job-runner
  namespace: sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs","jobs/status"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: code-runner-api-sandbox
  namespace: sandbox
subjects:
  - kind: ServiceAccount
    name: code-runner-api
    namespace: coderunner
roleRef:
  kind: Role
  name: sandbox-job-runner
  apiGroup: rbac.authorization.k8s.io