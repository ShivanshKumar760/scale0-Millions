services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    volumes:
      - ./app/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports: ["5432:5432"]
  redis:
    image: redis:7-alpine
  api:
    build: ./app
    environment:
      JWT_SECRET_KEY: dev-secret
      DATABASE_URL: postgresql://todo:todo@db:5432/todo
      REDIS_URL: redis://redis:6379/0
      WEB_CONCURRENCY: "2"
    ports: ["8000:8000"]
    depends_on: [db, redis]